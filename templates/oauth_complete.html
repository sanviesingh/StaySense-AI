<!doctype html><html><head><meta charset="utf-8"><title>OAuth Complete</title></head><body><p>Signing you in...</p><script>
const token = new URLSearchParams(location.search).get('token');
if(token){localStorage.setItem('access_token',token);history.replaceState({},'', '/oauth-complete');location.href='/dashboard';}else{location.href='/login';}
</script></body></html>
